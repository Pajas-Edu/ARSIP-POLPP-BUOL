<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPEREN - Arsip Digital Satpol PP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 55 11v19c0 15-9.5 26-23 31C18.5 56 9 45 9 30V11z' fill='%23c79a2e'/%3E%3Cpath d='M32 8 50 14v16c0 12.5-7.5 21.5-18 26C21.5 51.500 14 42.500 14 30V14z' fill='%2311332a'/%3E%3C/svg%3E">
<style>
/* SIPEREN - gaya aplikasi. Tanpa dependensi luar agar jalan di jaringan internal. */
:root {
  --spruce-950: #0c261f;
  --spruce-900: #11332a;
  --spruce-800: #18463a;
  --spruce-700: #215c4c;
  --brass: #c79a2e;
  --brass-soft: #f4e7c4;
  --ink: #18221e;
  --muted: #5b6963;
  --line: #d9e1dc;
  --bg: #edf1ee;
  --card: #ffffff;
  --ok: #1f7a4d;       --ok-soft: #dff2e6;
  --warn: #8a5a0a;     --warn-soft: #fbecc8;
  --danger: #b0281c;   --danger-soft: #fbe1de;
  --info: #1d5a9c;     --info-soft: #dfeaf8;
  --c-renja: #2b6aa3;  --c-rka: #b5741a;  --c-dpa: #17808a;  --c-laporan: #7b4fa0;
  --radius: 8px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg); }
a { color: var(--spruce-700); }
a:hover { color: var(--spruce-950); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; margin-bottom: 12px; }
p { margin: 0 0 10px; }
code { background: #e5ece8; padding: 1px 6px; border-radius: 4px; font-size: .9em; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.i { flex: none; vertical-align: -3px; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* ---------- kerangka ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 252px; flex: none; background: var(--spruce-900); color: #cfe0d8; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding: 16px 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; padding: 4px 8px 18px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px; }
.brand strong { display: block; font-size: 1.2rem; letter-spacing: .06em; }
.brand small { color: #a9c3b8; }
.nav-group { font-size: .78rem; color: #8fb0a2; margin: 18px 10px 6px; font-weight: 600; }
.nav-link { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 7px; color: #d9e8e1; text-decoration: none; font-weight: 500; border-left: 3px solid transparent; }
.nav-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-link.active { background: rgba(199,154,46,.16); color: #fff; border-left-color: var(--brass); }
.side-foot { margin-top: auto; padding: 16px 10px 4px; font-size: .8rem; color: #8fb0a2; border-top: 1px solid rgba(255,255,255,.1); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 24px; position: sticky; top: 0; z-index: 20; }
.topbar-title { font-size: 1.1rem; font-weight: 650; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user { display: flex; align-items: center; gap: 10px; }
.user form { margin: 0; }
.user-chip { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 4px 8px; border-radius: 8px; }
.user-chip:hover { background: var(--bg); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--spruce-800); color: #fff; display: grid; place-items: center; font-weight: 700; }
.user-meta strong { display: block; font-size: .9rem; line-height: 1.2; }
.user-meta small { color: var(--muted); font-size: .78rem; }
.content { padding: 24px; width: 100%; max-width: 1280px; }
.menu-btn, .scrim { display: none; }

/* ---------- komponen ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.card.flush { padding: 0; overflow: hidden; }
.card.narrow { max-width: 560px; margin: 40px auto; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head.pad { padding: 18px 20px 0; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.head-actions form { margin: 0; }
.crumb { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-master { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 7px; font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { background: #f3f6f4; border-color: #b9c6bf; color: var(--ink); }
.btn-primary { background: var(--spruce-800); border-color: var(--spruce-800); color: #fff; }
.btn-primary:hover { background: var(--spruce-950); border-color: var(--spruce-950); color: #fff; }
.btn-danger { color: var(--danger); border-color: #e5b4ae; }
.btn-danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-block { width: 100%; justify-content: center; padding: 11px 14px; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; border: 0; background: transparent; color: var(--spruce-700); cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: #e4ece7; }
.icon-btn.danger { color: var(--danger); }
.icon-btn.danger:hover { background: var(--danger-soft); }
form.inline { display: inline; margin: 0 0 0 10px; }

.badge { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: .78rem; font-weight: 600; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-muted { background: #e8edea; color: var(--muted); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 5px; font-size: .78rem; font-weight: 700; letter-spacing: .03em; color: #fff; background: var(--muted); }
.chip-RENJA { background: var(--c-renja); } .chip-RKA { background: var(--c-rka); } .chip-DPA { background: var(--c-dpa); } .chip-LAPORAN { background: var(--c-laporan); }

.alert { padding: 11px 14px; border-radius: 7px; margin-bottom: 16px; border: 1px solid; }
.alert ul { margin: 6px 0 0; padding-left: 20px; }
.alert-success { background: var(--ok-soft); border-color: #a9d9bd; color: #124d2f; }
.alert-error { background: var(--danger-soft); border-color: #eeb3ac; color: #7d1a11; }
.alert-warning { background: var(--warn-soft); border-color: #efd28a; color: #5f3e05; }
.alert-info { background: var(--info-soft); border-color: #b4cdea; color: #123f70; }

.empty { display: flex; flex-direction: column; gap: 4px; padding: 36px 20px; text-align: center; color: var(--muted); }
.empty strong { color: var(--ink); }
.empty-cell { text-align: center; color: var(--muted); padding: 28px 12px !important; }

/* ---------- tabel ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 650; padding: 11px 14px; background: #f5f8f6; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 14px; border-bottom: 1px solid #e8eeea; vertical-align: top; }
.table tbody tr:hover { background: #f8faf9; }
.table tbody tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
.table .actions-col { width: 1%; white-space: nowrap; text-align: right; }
.table tfoot th { background: #eef3f0; color: var(--ink); border-top: 1px solid var(--line); }
.row-actions { display: inline-flex; align-items: center; gap: 2px; justify-content: flex-end; }
.row-actions form { margin: 0; }
.doc-title { font-weight: 650; text-decoration: none; color: var(--ink); }
.doc-title:hover { text-decoration: underline; color: var(--spruce-700); }
.sub { font-size: .8rem; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pagination { display: flex; gap: 4px; justify-content: center; margin: -4px 0 20px; flex-wrap: wrap; }
.pg { min-width: 36px; text-align: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; text-decoration: none; color: var(--ink); font-weight: 600; }
.pg.active { background: var(--spruce-800); border-color: var(--spruce-800); color: #fff; }
.pg.gap { border: 0; background: transparent; }

/* ---------- formulir ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.span-2 { grid-column: span 2; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; min-width: 0; border: 0; padding: 0; margin-left: 0; margin-right: 0; }
.form-grid .field { margin-bottom: 0; }
.field label, .field legend { font-weight: 600; font-size: .88rem; padding: 0; }
.req { color: var(--danger); }
input[type=text], input[type=search], input[type=password], input[type=email], input[type=number], input[type=date], select, textarea, input[type=file] {
  width: 100%; padding: 9px 11px; border: 1px solid #bccac3; border-radius: 7px; background: #fff; font: inherit; color: var(--ink);
}
input[type=file] { padding: 8px; background: #f7faf8; }
textarea { resize: vertical; }
input:disabled { background: #eef2ef; color: var(--muted); }
.hint { color: var(--muted); font-size: .82rem; }
.radio { display: flex; align-items: baseline; gap: 8px; font-weight: 500 !important; padding: 3px 0; }
.radio small { color: var(--muted); font-weight: 400; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; }
.filters .field { margin: 0; min-width: 130px; }
.filters .field.grow { flex: 1 1 240px; }
.filters .actions { flex-direction: row; gap: 8px; min-width: 0; }

/* ---------- dashboard ---------- */
.tabs-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.folder-tab { --c: var(--muted); display: flex; flex-direction: column; gap: 2px; padding: 16px 18px 16px; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 4px 4px var(--radius) var(--radius); text-decoration: none; color: var(--ink); position: relative; }
.folder-tab::before { content: ""; position: absolute; top: -6px; left: 0; width: 42%; height: 6px; background: var(--c); border-radius: 4px 14px 0 0; }
.folder-tab:hover { border-color: var(--c); background: #fbfcfb; }
.tab-label { font-weight: 800; letter-spacing: .06em; color: var(--c); font-size: .95rem; }
.tab-count { font-size: 2.3rem; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tab-name { font-size: .82rem; color: var(--muted); }
.tab-RENJA { --c: var(--c-renja); } .tab-RKA { --c: var(--c-rka); } .tab-DPA { --c: var(--c-dpa); } .tab-LAPORAN { --c: var(--c-laporan); }
.ybars { display: flex; flex-direction: column; gap: 12px; }
.ybar { display: grid; grid-template-columns: 48px 1fr 36px; align-items: center; gap: 10px; }
.ylabel { font-weight: 650; font-variant-numeric: tabular-nums; }
.ytotal { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.ytrack { background: #eef2ef; border-radius: 5px; height: 24px; overflow: hidden; }
.yfill { height: 100%; display: flex; gap: 2px; }
.seg { display: block; min-width: 4px; }
.seg-RENJA { background: var(--c-renja); } .seg-RKA { background: var(--c-rka); } .seg-DPA { background: var(--c-dpa); } .seg-LAPORAN { background: var(--c-laporan); }
.legend { display: flex; gap: 16px; margin-top: 16px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e8eeea; align-items: flex-start; }
.recent li:last-child { border-bottom: 0; }
.recent .chip { margin-top: 2px; min-width: 66px; text-align: center; }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; display: flex; flex-direction: column; }
.stat-num { font-size: 1.4rem; font-weight: 700; }
.stat-label { font-size: .82rem; color: var(--muted); }

/* ---------- detail ---------- */
.preview { padding: 0; overflow: hidden; margin-bottom: 0; }
.preview iframe { display: block; width: 100%; height: 640px; border: 0; background: #e8eeea; }
.no-preview { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 60px 20px; text-align: center; color: var(--muted); }
.no-preview strong { color: var(--ink); word-break: break-all; }
.info { margin-bottom: 0; }
.info dl, .info-list { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; font-size: .9rem; }
.info dt, .info-list dt { color: var(--muted); }
.info dd, .info-list dd { margin: 0; word-break: break-word; }
.info-list { margin: 12px 0; }
.pre { white-space: pre-wrap; }
.detail-grid + .card { margin-top: 20px; }

/* ---------- tab & lain-lain ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tab { padding: 9px 16px; text-decoration: none; color: var(--muted); font-weight: 650; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--spruce-800); border-bottom-color: var(--brass); }
.rekap tfoot th { font-size: .9rem; }

/* ---------- halaman tanpa kerangka ---------- */
.bare-wrap { padding: 20px; }
.login-body { margin: 0; }
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.login-hero { background: linear-gradient(160deg, var(--spruce-950), var(--spruce-800)); color: #e8f1ed; padding: 8vh 7vw; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.login-hero h1 { font-size: 3rem; letter-spacing: .1em; color: #fff; }
.hero-sub { font-size: 1.15rem; color: #cfe0d8; max-width: 26ch; }
.hero-tabs { list-style: none; display: flex; gap: 8px; padding: 0; margin: 8px 0; flex-wrap: wrap; }
.hero-tabs .chip { padding: 4px 12px; font-size: .85rem; }
.hero-note { color: #a9c3b8; max-width: 44ch; }
.login-form { display: grid; place-items: center; padding: 32px 24px; background: var(--card); }
.login-form form { width: 100%; max-width: 360px; }
.login-form h2 { margin-bottom: 20px; }
.login-form .hint { margin-top: 16px; text-align: center; }

/* ---------- responsif ---------- */
@media (max-width: 1000px) {
  .grid-2, .grid-master, .detail-grid { grid-template-columns: 1fr; }
  .tabs-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s ease; }
  body.nav-open .sidebar { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-grid; }
  .topbar { padding: 8px 12px; }
  .content { padding: 16px 12px; }
  .user-meta, .hide-sm { display: none; }
  .login { grid-template-columns: 1fr; }
  .login-hero { padding: 36px 24px; }
  .login-hero h1 { font-size: 2.2rem; }
}
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .stat-row { grid-template-columns: 1fr; }
  .filters .field { flex: 1 1 140px; }
  .info dl { grid-template-columns: 1fr; gap: 2px 0; }
  .info dt { margin-top: 8px; }
}
@media (max-width: 760px) { .table { min-width: 720px; } .table .doc-title { display: inline-block; min-width: 200px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  .sidebar, .topbar, .filters, .head-actions, .pagination, .menu-btn { display: none !important; }
  body { background: #fff; }
  .content { padding: 0; max-width: none; }
  .card { border: 0; padding: 0; }
}

.demo-bar { background: var(--brass-soft); color: #5a4208; font-size: .82rem; padding: 6px 24px; border-bottom: 1px solid #e3cf95; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.demo-bar button { background: none; border: 0; color: #5a4208; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
.acct-list { display: grid; gap: 8px; margin: 18px 0 0; }
.acct { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; border: 1px solid var(--line); background: #f7faf8; border-radius: 7px; cursor: pointer; font: inherit; color: var(--ink); }
.acct:hover { border-color: var(--spruce-700); background: #fff; }
.acct small { color: var(--muted); }
.login-form .sep { margin: 22px 0 0; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
button.nav-link { width: 100%; background: none; border: 0; border-left: 3px solid transparent; text-align: left; font: inherit; cursor: pointer; }
.pg { cursor: pointer; font: inherit; font-weight: 600; }
a.tab, a.nav-link { cursor: pointer; }
.app.nav-open .sidebar { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }

/* ===== Tambahan versi server ===== */
.pw-wrap { position: relative; display: flex; }
.pw-wrap input { width: 100%; padding-right: 46px; }
.pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); padding: 7px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; line-height: 0; }
.pw-toggle:hover { background: #e5ece8; color: var(--spruce-900); }
.pw-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.solo { max-width: 460px; margin: 6vh auto; padding: 0 16px; }
.preview-hint { padding: 8px 14px; margin: 0; border-top: 1px solid var(--line); }
body.busy { cursor: progress; }
body.busy::before { content: ''; position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 100; background: linear-gradient(90deg, transparent, var(--brass), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: busybar 1s linear infinite; }
@keyframes busybar { from { background-position: -40% 0; } to { background-position: 140% 0; } }

</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tgl = (d, jam) => { if (!d) return '-'; const t = new Date(d); if (isNaN(t)) return '-'; const s = t.getDate() + ' ' + BULAN[t.getMonth()] + ' ' + t.getFullYear(); return jam ? s + ', ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') : s; };
const bytes = n => { let b = +n || 0, u = ['B','KB','MB','GB'], i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(1).replace('.', ',') : b) + ' ' + u[i]; };
const nowISO = () => new Date().toISOString();
let MAX_BYTES = 10 * 1048576;
/* ---------- ikon ---------- */
const IC = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',

function panggil(action, data) {
  return new Promise((ok, gagal) => {
    const body = JSON.stringify(Object.assign({ action, token: TOKEN }, data || {}));
    const selesai = s => { let j; try { j = JSON.parse(s); } catch (e) { return gagal(new Galat('Respons server tidak valid.')); } if (j.ok) ok(j.data); else gagal(new Galat(j.error, j.kode, j.rinci)); };

    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(selesai).withFailureHandler(putus).api(body);

function matrix(label, data, kats) {
  const tot = Object.fromEntries(kats.map(k => [k, 0]));
  const rows = Object.entries(data); if (label === 'Tahun') rows.sort((a, b) => b[0] - a[0]);
  return `<div class="table-wrap"><table class="table rekap"><thead><tr><th>${label}</th>${kats.map(k => `<th class="num">${k}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${rows.length ? rows.map(([n, r]) => `<tr><td>${esc(n)}</td>${kats.map(k => { tot[k] += r[k] || 0; return `<td class="num">${r[k] || 0}</td>`; }).join('')}<td class="num"><strong>${Object.values(r).reduce((a, b) => a + b, 0)}</strong></td></tr>`).join('') : `<tr><td colspan="${kats.length + 2}" class="empty-cell">Belum ada data.</td></tr>`}</tbody>${rows.length ? `<tfoot><tr><th>Jumlah</th>${kats.map(k => `<th class="num">${tot[k]}</th>`).join('')}<th class="num">${Object.values(tot).reduce((a, b) => a + b, 0)}</th></tr></tfoot>` : ''}</table></div>`;
}
function rekapData() {
  const docs = S.dokumen.filter(d => !d.deleted && canView(d) && (!V.rt || d.tahun == V.rt) && (!V.rb || d.bidang == V.rb));
  const bt = {}, bb = {};
  docs.sort((a, b) => thn(b.tahun).tahun - thn(a.tahun).tahun).forEach(d => { const t = thn(d.tahun).tahun; (bt[t] = bt[t] || {})[d.kat] = (bt[t][d.kat] || 0) + 1; });
  docs.forEach(d => { const n = bid(d.bidang).nama; (bb[n] = bb[n] || {})[d.kat] = (bb[n][d.kat] || 0) + 1; });
  return { docs, bt, bb };
}
function pRekap() {
  if (!can('rekap.view')) return deny();
  const { bt, bb } = rekapData(); const kats = S.kategori.map(k => k.kode);
  return layout('Rekap arsip', 'rekap', `<div class="page-head"><div><h2>Rekap jumlah arsip</h2><p class="muted">Dihitung dari dokumen aktif yang boleh Anda akses.</p></div><div class="head-actions"><button class="btn" data-act="print">${ic('print', 16)}Cetak / simpan PDF</button><button class="btn btn-primary" data-act="csv">${ic('download', 16)}Ekspor Excel (CSV)</button></div></div>

  <section class="card flush"><div class="card-head pad"><h2>Per tahun anggaran</h2></div>${matrix('Tahun', bt, kats)}</section><section class="card flush"><div class="card-head pad"><h2>Per bidang</h2></div>${matrix('Bidang', bb, kats)}</section>`);
}

  if (!can('user.manage')) return deny();
  if (mode) {
    const e = mode === 'new' ? null : usr(+mode); const v = val || e || { nama: '', nip: '', username: '', email: '', role: '', bidang: '' };
    return layout(e ? 'Ubah pengguna' : 'Tambah pengguna', 'pengguna', `${errs && errs.length ? `<div class="alert alert-error"><strong>Periksa kembali isian Anda:</strong><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <form class="card form" data-form="user" data-id="${e ? e.id : ''}"><div class="form-grid">
    <div class="field span-2"><label for="un">Nama lengkap <span class="req">*</span></label><input id="un" name="nama" maxlength="150" value="${esc(v.nama)}" required></div>
    <div class="field"><label for="nip">NIP</label><input id="nip" name="nip" maxlength="30" value="${esc(v.nip)}"></div><div class="field"><label for="em">Email</label><input id="em" name="email" type="email" value="${esc(v.email)}"></div>
    <div class="field"><label for="us">Username <span class="req">*</span></label><input id="us" name="username" maxlength="50" value="${esc(v.username)}" required></div>
    <div class="field"><label for="pw">${e ? 'Password baru' : 'Password awal'}</label><input id="pw" name="pass" type="text" minlength="8" ${e ? '' : 'required'}><small class="hint">${e ? 'Kosongkan jika tidak diubah. ' : ''}Minimal 8 karakter. Pengguna wajib menggantinya saat masuk pertama.</small></div>
    <div class="field"><label for="ro">Peran <span class="req">*</span></label><select id="ro" name="role" required><option value="">Pilih peran</option>${Object.entries(ROLES).map(([k, l]) => opt(k, l, v.role)).join('')}</select><small class="hint">Operator Bidang wajib memilih bidang.</small></div>
    <div class="field"><label for="bi">Bidang</label><select id="bi" name="bidang"><option value="">Tidak ada</option>${S.bidang.map(b => opt(b.id, b.nama, v.bidang)).join('')}</select></div></div>
    <div class="form-actions"><a class="btn" href="#/pengguna">Batal</a><button class="btn btn-primary" type="submit">Simpan pengguna</button></div></form>`);
  }
  return layout('Manajemen pengguna', 'pengguna', `<div class="page-head"><div><h2>Pengguna SIPEREN</h2><p class="muted">${S.users.length} akun terdaftar.</p></div><div class="head-actions"><a class="btn btn-primary" href="#/pengguna/new">${ic('plus', 16)}Tambah pengguna</a></div></div>
  <div class="card flush"><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Bidang</th><th>Peran</th><th>Status</th><th>Terakhir masuk</th><th class="actions-col">Aksi</th></tr></thead><tbody>
  ${S.users.map(u => `<tr><td><strong>${esc(u.nama)}</strong><div class="sub">${esc(u.username)}${u.nip ? ' &middot; NIP ' + esc(u.nip) : ''}</div></td><td>${esc(u.bidang ? bid(u.bidang).nama : '-')}</td><td>${ROLES[u.role]}</td><td><span class="badge badge-${u.aktif ? 'ok' : 'muted'}">${u.aktif ? 'Aktif' : 'Nonaktif'}</span></td><td class="nowrap">${tgl(u.last, true)}</td>
  <td class="actions-col"><div class="row-actions"><a class="icon-btn" href="#/pengguna/${u.id}" aria-label="Ubah ${esc(u.username)}">${ic('edit', 17)}</a><button class="icon-btn" data-act="ureset" data-id="${u.id}" aria-label="Reset password ${esc(u.username)}">${ic('key', 17)}</button>${u.id !== myId() ? `<button class="btn" data-act="utoggle" data-id="${u.id}">${u.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div></div>`);
}

function pProfil(errs) {
  const u = cur();
  return layout('Profil saya', '', `${errs && errs.length ? `<div class="alert alert-error"><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}<div class="grid-2">
  <form class="card form" data-form="profil"><h3>Data diri</h3><div class="field"><label for="pn">Nama lengkap</label><input id="pn" name="nama" value="${esc(u.nama)}" required></div><div class="field"><label for="pe">Email</label><input id="pe" name="email" type="email" value="${esc(u.email)}"></div>
  <dl class="info-list"><dt>Username</dt><dd>${esc(u.username)}</dd><dt>Peran</dt><dd>${ROLES[u.role]}</dd><dt>Bidang</dt><dd>${esc(u.bidang ? bid(u.bidang).nama : '-')}</dd></dl><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan data diri</button></div></form>
  <form class="card form" data-form="pass"><h3>Ganti password</h3>${pwField('p1', 'old', 'Password lama', 'current-password')}${pwField('p2', 'new', 'Password baru', 'new-password', { minlength: 8, hint: 'Minimal 8 karakter.' })}${pwField('p3', 'conf', 'Ulangi password baru', 'new-password', { minlength: 8 })}<div class="form-actions"><button class="btn btn-primary" type="submit">Ganti password</button></div></form></div>`);
}
const deny = () => layout('Akses ditolak', '', '<div class="card narrow"><h2>Akses ditolak</h2><p>Peran Anda tidak memiliki hak akses ke halaman ini.</p><p><a class="btn" href="' + home() + '">Kembali ke beranda</a></p></div>');
/* ---------- router ---------- */
const root = document.getElementById('root');
const go = h => { if (location.hash === h) route(); else location.hash = h; };
function syncJenis() { const k = document.getElementById('kat'); if (k) k.dispatchEvent(new Event('change', { bubbles: true })); }
function show(html, after) { root.innerHTML = html; window.scrollTo(0, 0); if (after) after(); }
let BLOBURL = null;
async function pratinjau(docId) {
  const el = document.getElementById('pdfv'); const d = S.dokumen.find(x => x.id === docId); const v = d && activeV(d);
  if (!el || !v) return;
  const info = el.parentElement.querySelector('.preview-hint');
  try {
    const f = await api('unduh', { versiId: v.id, pratinjau: true }, true);
    if (!document.body.contains(el)) return;
    if (BLOBURL) URL.revokeObjectURL(BLOBURL);
    BLOBURL = URL.createObjectURL(toBlob(f)); el.src = BLOBURL;
    if (info) info.textContent = 'Jika pratinjau kosong atau tidak tampil di browser Anda, gunakan tombol Unduh.';
  } catch (e) { if (e.kode !== 'SESI' && document.body.contains(el)) el.replaceWith(Object.assign(document.createElement('div'), { className: 'no-preview', textContent: 'Pratinjau gagal dimuat: ' + e.message + ' Gunakan tombol Unduh.' })); if (info) info.remove(); }
}
async function route(keepScroll) {
  const my = ++RT;
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?'); const seg = path.split('/').filter(Boolean); const q = new URLSearchParams(qs || '');
  const y = window.scrollY; let html = '', after = null;
  if (!cur()) { show(pLogin()); return; }
  const [p, a] = seg;
  if (cur().wajib && p !== 'wajib') { go('#/wajib'); return; }
  if (!cur().wajib && p === 'wajib') { go(home()); return; }
  if (!cur().wajib && Date.now() - LASTSYNC > 45000) { try { await sync(); } catch (e) { if (e.kode === 'SESI') return; flash('error', e.message); } if (my !== RT) return; if (!cur()) { show(pLogin()); return; } }
  if (q.get('order') === 'recent') V.order = 'recent';
  switch (p) {
    case 'wajib': html = pWajib(); break;
    case 'dashboard': html = can('dashboard') ? pDashboard() : deny(); break;
    case 'arsip': if (V.k !== a) { V.k = a; } html = pList(a, false); break;
    case 'cari': html = pList('', true); break;
    case 'form': html = pForm(a && !isNaN(+a) ? +a : 0, q.get('k') || ''); after = syncJenis; break;
    case 'doc': html = pDetail(+a); after = () => pratinjau(+a); break;
    case 'rekap': html = pRekap(); break;
    case 'log': html = pLog(); break;
    case 'master': html = pMaster(a, +seg[2] || 0); break;
    case 'pengguna': html = pUsers(a || ''); break;
    case 'profil': html = pProfil(); break;
    default: location.hash = home(); return;
  }
  show(html, after); if (keepScroll) window.scrollTo(0, y);
}
window.addEventListener('hashchange', () => { V = freshV(); NAVOPEN = false; route(); });

/* ---------- aksi ---------- */
const extOf = n => (n.split('.').pop() || '').toLowerCase();
function checkFile(f) { if (!f || !f.size) return 'Pilih file dokumen terlebih dahulu.'; if (!['pdf', 'docx', 'xlsx'].includes(extOf(f.name))) return 'Tipe file tidak diizinkan. Gunakan PDF, DOCX, atau XLSX.'; if (f.size > MAX_BYTES) return 'Ukuran file melebihi batas ' + bytes(MAX_BYTES) + '.'; return null; }
async function download(vid) {
  const f = await api('unduh', { versiId: vid });
  const url = URL.createObjectURL(toBlob(f)); const a = document.createElement('a'); a.href = url; a.download = f.nama; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
const aman = fn => async (...args) => {
  try { return await fn(...args); }
  catch (e) { if (e.kode === 'SESI') return; if (e.kode === 'GANTI') { if (S.me) S.me.wajib = true; return go('#/wajib'); } flash('error', e.rinci ? e.rinci.join(' ') : e.message); route(true); }
};
const A = {
  nav() { NAVOPEN = !NAVOPEN; document.getElementById('appshell')?.classList.toggle('nav-open', NAVOPEN); },
  page(el) { V.page = +el.dataset.p; route(); },
  resetf() { V = freshV(); const [p, a] = location.hash.replace(/^#\/?/, '').split('/'); if (p === 'arsip') V.k = a; route(); },
  trash() { V.trash = !V.trash; V.page = 1; route(); },
  print() { window.print(); },
  pwtoggle(el) {
    const i = el.parentElement.querySelector('input'); const tampil = i.type === 'password';
    i.type = tampil ? 'text' : 'password';
    el.setAttribute('aria-pressed', String(tampil)); el.setAttribute('aria-label', tampil ? 'Sembunyikan password' : 'Tampilkan password'); el.title = tampil ? 'Sembunyikan password' : 'Tampilkan password';
    el.innerHTML = ic(tampil ? 'eyeoff' : 'eye', 18); i.focus();
  },
  refresh: aman(async () => { await sync(); flash('success', 'Data dimuat ulang dari server.'); route(true); }),
  logout() { api('logout', {}, true).catch(() => {}); setToken(''); S = KOSONG(); V = freshV(); flash('success', 'Anda telah keluar.'); go('#/'); },
  dl: aman(async el => { if (el.dataset.v) return download(+el.dataset.v); const d = S.dokumen.find(x => x.id === +el.dataset.dok), v = d && activeV(d); if (v) await download(v.id); }),
  del: aman(async el => {
    if (!can('doc.delete')) return; const d = S.dokumen.find(x => x.id === +el.dataset.id); if (!confirm('Pindahkan dokumen ini ke tempat sampah?')) return;
    await api('hapusDok', { id: d.id }); await sync(); flash('success', 'Dokumen dipindahkan ke tempat sampah. Admin masih bisa memulihkannya.'); go('#/arsip/' + d.kat);
  }),
  restore: aman(async el => {
    if (!can('doc.delete')) return; const id = +el.dataset.id;
    await api('pulihkan', { id }); await sync(); flash('success', 'Dokumen dipulihkan.'); V.trash = false; go('#/doc/' + id);
  }),
  csv() {
    const { docs, bt, bb } = rekapData(); const kats = S.kategori.map(k => k.kode); const L = [];
    const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    L.push('sep=;', 'REKAP PER TAHUN ANGGARAN', ['Tahun', ...kats, 'Total'].join(';'));
    Object.entries(bt).sort((a, b) => b[0] - a[0]).forEach(([k, r]) => L.push([k, ...kats.map(c => r[c] || 0), Object.values(r).reduce((a, b) => a + b, 0)].join(';')));
    L.push('', 'REKAP PER BIDANG', ['Bidang', ...kats, 'Total'].join(';'));
    Object.entries(bb).forEach(([k, r]) => L.push([q(k), ...kats.map(c => r[c] || 0), Object.values(r).reduce((a, b) => a + b, 0)].join(';')));
    L.push('', 'DAFTAR DOKUMEN', ['Kategori', 'Jenis', 'Nomor', 'Judul', 'Tahun', 'Bidang', 'Tanggal dokumen', 'Level akses', 'Status', 'Versi aktif', 'Diunggah oleh'].join(';'));
    docs.forEach(d => { const v = activeV(d); L.push([d.kat, q(d.jenis ? jns(d.jenis).nama : ''), q(d.nomor), q(d.judul), thn(d.tahun).tahun, q(bid(d.bidang).nama), d.tglDok || '', d.level, d.status, v ? v.ke : '', q(usr(d.by).nama)].join(';')); });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = 'rekap-arsip-siperen.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    api('ekspor', { ket: 'Rekap arsip CSV' }, true).catch(() => {});
  },
  mdel: aman(async el => {
    const t = el.dataset.t, id = +el.dataset.id; if (!confirm('Hapus data ini?')) return;
    await api('hapusMaster', { t, id }); await sync(); flash('success', 'Data dihapus.'); route(true);
  }),
  utoggle: aman(async el => {
    const u = usr(+el.dataset.id); if (!confirm((u.aktif ? 'Nonaktifkan' : 'Aktifkan') + ' akun ' + u.username + '?')) return;
    await api('toggleUser', { id: u.id }); await sync(); flash('success', 'Akun ' + u.username + ' kini ' + (usr(u.id).aktif ? 'aktif' : 'nonaktif') + '.'); route(true);
  }),
  ureset: aman(async el => {
    const u = usr(+el.dataset.id); if (!confirm('Buat password sementara baru untuk ' + u.username + '? Password lama tidak berlaku dan sesi aktifnya dihentikan.')) return;
    const r = await api('resetUser', { id: u.id }); await sync(); flash('success', 'Password sementara untuk ' + r.username + ': ' + r.sandi + ' (catat sekarang, tidak ditampilkan lagi).'); route(true);
  })
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || !A[el.dataset.act]) return; e.preventDefault(); A[el.dataset.act](el); });
document.addEventListener('change', e => {
  if (e.target.id === 'kat' && e.target.form?.dataset.form === 'doc') { const j = document.getElementById('jenis'); [...j.options].forEach(o => { if (!o.value) return; const ok = !e.target.value || o.dataset.kat === e.target.value; o.hidden = !ok; o.disabled = !ok; }); if (j.selectedOptions[0]?.disabled) j.value = ''; }
});

const F = {
  async login(f, d) {
    try {
      const r = await api('login', { username: String(d.get('username')).trim(), password: d.get('password') });
      setToken(r.token); delete r.token; pakaiSnapshot(r); V = freshV(); go(S.me.wajib ? '#/wajib' : home());
    } catch (e) { show(pLogin(e.message)); }
  },
  filter(f, d) { V.q = d.get('q') || ''; V.tahun = d.get('tahun') || ''; V.bidang = d.get('bidang') || ''; V.status = d.get('status') || ''; V.akses = d.get('akses') || ''; if (d.has('k')) V.k = d.get('k') || ''; V.page = 1; route(true); },
  rekapf(f, d) { V.rt = d.get('rt') || ''; V.rb = d.get('rb') || ''; route(true); },
  logf(f, d) { V.aksi = d.get('aksi') || ''; V.user = d.get('user') || ''; V.dari = d.get('dari') || ''; V.sampai = d.get('sampai') || ''; V.page = 1; route(true); },
  async doc(f, d) {
    const id = +f.dataset.id || 0, u = cur(), errs = [];
    const val = { kat: d.get('kat'), jenis: d.get('jenis') ? +d.get('jenis') : null, nomor: (d.get('nomor') || '').trim(), judul: (d.get('judul') || '').trim(), tahun: +d.get('tahun') || '', bidang: u.role === 'operator' ? (u.bidang || '') : (+d.get('bidang') || ''), tglDok: d.get('tglDok') || '', desc: (d.get('desc') || '').trim(), level: d.get('level'), status: d.get('status') };
    if (!S.kategori.some(k => k.kode === val.kat)) errs.push('Pilih kategori dokumen.');
    if (!val.nomor) errs.push('Nomor dokumen wajib diisi.'); if (!val.judul) errs.push('Judul dokumen wajib diisi.');
    if (!val.tahun) errs.push('Pilih tahun anggaran.'); if (!val.bidang) errs.push(u.role === 'operator' ? 'Akun Anda belum terhubung ke bidang. Hubungi administrator.' : 'Pilih bidang.');
    if (val.jenis && jns(val.jenis)?.kat !== val.kat) errs.push('Jenis dokumen tidak sesuai kategori.');
    let file = null; if (!id) { file = d.get('file'); const er = checkFile(file); if (er) errs.push(er); }
    if (errs.length) return show(pForm(id, '', errs, val), syncJenis);
    const payload = Object.assign({ id }, val);
    if (!id) { payload.fileName = file.name; payload.fileBase64 = await baca(file); }
    try {
      const r = await api('simpanDok', payload); await sync();
      flash('success', id ? 'Data dokumen diperbarui.' : 'Dokumen berhasil diarsipkan sebagai versi 1.'); go('#/doc/' + r.id);
    } catch (e) { if (e.kode === 'VALID') return show(pForm(id, '', e.rinci, val), syncJenis); throw e; }
  },
  async versi(f, d) {
    const id = +f.dataset.id, file = d.get('file');
    const er = checkFile(file); if (er) { flash('error', er); return route(true); }
    const r = await api('versiBaru', { id, fileName: file.name, fileBase64: await baca(file), catatan: (d.get('catatan') || '').trim() });
    await sync(); flash('success', 'Versi ' + r.ke + ' berhasil diunggah dan kini menjadi versi aktif.'); V.lastViewed = id; route();
  },
  async master(f, d) {
    const t = f.dataset.t, id = +f.dataset.id || 0; const p = { t, id };
    if (t === 'bidang') { p.kode = d.get('kode'); p.nama = d.get('nama'); } else if (t === 'tahun') { p.tahun = d.get('tahun'); p.status = d.get('status'); } else { p.kat = d.get('kat'); p.nama = d.get('nama'); }
    await api('simpanMaster', p); await sync(); flash('success', id ? 'Perubahan disimpan.' : 'Data ditambahkan.'); go('#/master/' + t);
  },
  async user(f, d) {
    const id = +f.dataset.id || 0;
    const val = { nama: (d.get('nama') || '').trim(), nip: (d.get('nip') || '').trim(), email: (d.get('email') || '').trim(), username: (d.get('username') || '').trim(), role: d.get('role'), bidang: d.get('bidang') ? +d.get('bidang') : '' };
    try { await api('simpanUser', Object.assign({ id, pass: d.get('pass') || '' }, val)); await sync(); flash('success', id ? 'Data pengguna diperbarui.' : 'Pengguna ditambahkan. Berikan username dan password awal kepada pemiliknya; password wajib diganti saat masuk pertama.'); go('#/pengguna'); }
    catch (e) { if (e.kode === 'VALID') return show(pUsers(id || 'new', e.rinci, val)); throw e; }
  },
  async profil(f, d) { await api('profil', { nama: d.get('nama'), email: d.get('email') }); await sync(); flash('success', 'Profil diperbarui.'); route(); },
  async pass(f, d) {
    const errs = []; if ((d.get('new') || '').length < 8) errs.push('Password baru minimal 8 karakter.'); if (d.get('new') !== d.get('conf')) errs.push('Konfirmasi password tidak sama.');
    if (errs.length) return show(pProfil(errs));
    try { await api('gantiPass', { old: d.get('old'), new: d.get('new'), conf: d.get('conf') }); flash('success', 'Password berhasil diganti.'); route(); }
    catch (e) { if (e.kode === 'VALID') return show(pProfil(e.rinci)); throw e; }
  },
  async wajib(f, d) {
    const errs = []; if ((d.get('new') || '').length < 8) errs.push('Password baru minimal 8 karakter.'); if (d.get('new') !== d.get('conf')) errs.push('Konfirmasi password tidak sama.');
    if (errs.length) return show(pWajib(errs));
    try { await api('gantiPass', { old: d.get('old'), new: d.get('new'), conf: d.get('conf') }); await sync(); flash('success', 'Password berhasil dibuat. Selamat datang di SIPEREN.'); go(home()); }
    catch (e) { if (e.kode === 'VALID') return show(pWajib(e.rinci)); throw e; }
  }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f || !F[f.dataset.form]) return; e.preventDefault();
  const btn = f.querySelector('button[type=submit]'), lama = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = f.dataset.form === 'doc' ? (f.dataset.id ? 'Menyimpan...' : 'Mengunggah...') : f.dataset.form === 'versi' ? 'Mengunggah...' : 'Memproses...'; }
  try { await F[f.dataset.form](f, new FormData(f)); }
  catch (er) { if (er.kode === 'SESI') return; if (er.kode === 'GANTI') { if (S.me) S.me.wajib = true; return go('#/wajib'); } flash('error', er.message); route(true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = lama; } }
});

(async () => {
  if (TOKEN) { try { await sync(); } catch (e) { setToken(''); S = KOSONG(); } }
  if (!location.hash || location.hash === '#') go(cur() ? (cur().wajib ? '#/wajib' : home()) : '#/'); else route();
})();

})();
</script>
